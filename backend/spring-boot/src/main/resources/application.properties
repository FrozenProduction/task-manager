# =============================================
# Task Manager API — Spring Boot (default profile: local H2)
# =============================================
#
# Environment variables (production):
#   SPRING_DATASOURCE_URL      — JDBC URL for PostgreSQL
#   SPRING_DATASOURCE_USERNAME — DB username
#   SPRING_DATASOURCE_PASSWORD — DB password
#   JWT_SECRET                 — Secret key for signing JWT tokens (REQUIRED in production)
#   JWT_EXPIRATION_MS          — Token expiration in milliseconds (default: 86400000 = 24h)
#
# For local development with H2 (in-memory), no env vars are needed.
# Set SPRING_PROFILES_ACTIVE=prod to switch to PostgreSQL (see
# application-prod.properties, loaded automatically by filename).
# =============================================

# ---- Application ----
spring.application.name=task-manager-api

# ---- JWT Configuration (optional in dev; required in prod) ----
# In production, set JWT_SECRET. In dev, defaults to a dev-only key.
# NEVER commit a real production secret to source control.
jwt.secret=${JWT_SECRET:change-me-in-production-min-32-characters-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Local profile (H2 in-memory, default) ----
spring.datasource.url=jdbc:h2:mem:taskmanager;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.hibernate.SQL=DEBUG

# ---- Flyway (prod only) ----
# Local/CI use a fresh H2 where Hibernate creates the full schema itself
# (including new columns — verified). Flyway must stay OFF there: it runs
# before Hibernate, so on an empty schema the ALTERs fail and kill startup.
# Prod enables it via the SPRING_FLYWAY_ENABLED env var (see render.yaml).
spring.flyway.enabled=false

# ---- Server ----
server.port=${PORT:8080}

# ---- OpenAPI / Swagger ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ---- Link Logger integration (backend-to-backend HTTP client) ----
# Loaded for ALL profiles (local + prod). Defaults point at a local FastAPI
# dev server; production overrides via env vars
#   LINK_LOGGER_API_URL        — e.g. https://link-logger-api.onrender.com
#   LINK_LOGGER_PUBLIC_BASE_URL — e.g. https://link-logger-pink.vercel.app
#
# NOTE (Sept 7 deploy bug): this block MUST live in this default file, not
# in application-prod.properties — CI runs the default profile with no env
# vars, and missing placeholders crash startup.
link-logger.api-url=${LINK_LOGGER_API_URL:http://localhost:8000}
link-logger.public-base-url=${LINK_LOGGER_PUBLIC_BASE_URL:http://localhost:5173}
