# =============================================
# Task Manager API — Spring Boot
# =============================================
#
# Environment variables (production):
#   SPRING_DATASOURCE_URL      — JDBC URL for PostgreSQL
#   SPRING_DATASOURCE_USERNAME — DB username
#   SPRING_DATASOURCE_PASSWORD — DB password
#   JWT_SECRET                 — Secret key for signing JWT tokens (REQUIRED in production)
#   JWT_EXPIRATION_MS          — Token expiration in milliseconds (default: 86400000 = 24h)
#
# For local development with H2 (in-memory), no env vars are needed.
# Set SPRING_PROFILES_ACTIVE=prod to switch to PostgreSQL.
# =============================================

# ---- Application ----
spring.application.name=task-manager-api

# ---- JWT Configuration (optional in dev; required in prod) ----
# In production, set JWT_SECRET. In dev, defaults to a dev-only key.
# NEVER commit a real production secret to source control.
jwt.secret=${JWT_SECRET:change-me-in-production-min-32-characters-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Local profile (H2 in-memory, default) ----
spring.datasource.url=jdbc:h2:mem:taskmanager;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.org.hibernate.SQL=DEBUG

# ---- Production profile overrides (set via env vars or SPRING_PROFILES_ACTIVE=prod) ----
spring.config.activate.on-profile=prod

# DB env vars are read in DataSourceConfig.java (prod profile).
# We build the URL in code from individual components to avoid Spring
# Boot's relaxed binding mangling complex connection strings.
# Required env vars: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD.
# In dev (no prod profile), Spring Boot falls back to the H2 config above.

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false

# Disable Swagger/OpenAPI docs in production (security: don't expose API surface)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---- Server ----
server.port=${PORT:8080}

# ---- OpenAPI / Swagger ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
