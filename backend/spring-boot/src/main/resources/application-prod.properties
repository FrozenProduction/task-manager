# ============================================================
# Task Manager API — production overrides (SPRING_PROFILES_ACTIVE=prod).
# Loaded automatically by filename alongside application.properties.
# Split out of application.properties on Sept 8: the single-file
# multi-document marker (spring.config.activate.on-profile) caused the
# default document to be silently ignored at runtime with no active
# profile, so local runs lost all file config (incl. Flyway/properties).
# ============================================================

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false

# Disable Swagger/OpenAPI docs in production (security: don't expose API surface)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# DB env vars are read in DataSourceConfig.java (prod profile).
# We build the URL in code from individual components to avoid Spring
# Boot's relaxed binding mangling complex connection strings.
# Required env vars: DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD.
# In dev (no prod profile), Spring Boot falls back to the H2 config above.

# Flyway is controlled via the SPRING_FLYWAY_ENABLED env var (render.yaml),
# default false in application.properties. Do NOT add a spring.flyway key
# here: a duplicate key across profile files resolved to true at runtime.

# First Flyway run against the pre-existing database must baseline instead
# of failing ("non-empty schema but no schema history table"). The existing
# schema becomes version 1 implicitly; V2+ then apply normally. Harmless
# afterwards (ignored once history exists).
spring.flyway.baseline-on-migrate=true
