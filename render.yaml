# =============================================
# Render Blueprint for Task Manager Backend
# =============================================
# This blueprint declares ONLY the Web Service.
# The PostgreSQL database (`task-manager-db`) was already created manually
# on Render, so the databases: section is intentionally omitted — adding it
# would fail with a "database already exists" error.
#
# Setup steps:
#   1. Render Dashboard → Databases → confirm `task-manager-db` exists
#   2. Click "New" → "Blueprint" → point to this repo (master/main branch)
#   3. After the service is created:
#      - Set JWT_SECRET in the Environment tab
#      - SPRING_DATASOURCE_* values are pulled automatically from the
#        existing `task-manager-db` via fromDatabase
#   4. Wait for the first deploy to succeed
#   5. Verify with:  curl https://<service>.onrender.com/api/health
# =============================================

services:
  - type: web
    name: task-manager-api
    runtime: java
    plan: free
    rootDirectory: backend/spring-boot
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/task-manager-api-1.0.0.jar
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Force Java 17 (Render defaults vary; pom.xml requires 17).
      - key: JAVA_VERSION
        value: "17"

      - key: JWT_SECRET
        # MUST be replaced in Render Dashboard AFTER the service is created.
        # Render treats blueprint env values as immutable on re-deploy.
        # Generate locally with:
        #   python -c "import secrets; print(secrets.token_urlsafe(48))"
        value: SET_IN_DASHBOARD_AFTER_DEPLOY

      - key: CORS_ALLOWED_ORIGINS
        value: https://taskmanagerapp-tau.vercel.app,https://*.vercel.app

      # Link Logger integration (backend-to-backend HTTP client).
      # See application.properties for full explanation of why these are split.
      - key: LINK_LOGGER_API_URL
        value: https://link-logger-api.onrender.com
      - key: LINK_LOGGER_PUBLIC_BASE_URL
        value: https://link-logger-pink.vercel.app

      # Flyway: baseline the existing schema, then apply V2 (tasks
      # source_link_* columns) at startup. Env beats the
      # application.properties default (false) via Spring relaxed binding. NOTE: if Render does not
      # pick up this new key from the blueprint on deploy, add it manually
      # once in Dashboard → task-manager-api → Environment and redeploy.
      - key: SPRING_FLYWAY_ENABLED
        value: "true"

      # Link to your existing PostgreSQL instance (created manually).
      # These references work as long as the DB lives in the SAME Render account.
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString

      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: task-manager-db
          property: user

      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: task-manager-db
          property: password

# NOTE: databases: section intentionally removed.
# `task-manager-db` already exists on Render.

# ---- Free-tier caveats ----
# - Web service sleeps after 15 min inactivity; first request after sleep = 30–50s.
# - Free PostgreSQL expires after 90 days of inactivity (Render emails before).
# - CORS_ALLOWED_ORIGINS: tighten to your exact frontend URL in production.
# - JWT_SECRET: use a strong, random 48+ char token_urlsafe string.